<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPT Task</title>
    <link rel="stylesheet" href="/static/css/cpt.css"> <!-- Link to the updated CSS file -->
</head>
<body>
    <!-- CPT Tutorial Section -->
    <div id="cpt_tutorial">
        <h1 class="tutorial_title">Welcome to the CPT Task</h1>
        <p class="tutorial_desc">In this task, press the <strong>spacebar</strong> for every letter that appears <strong>except the letter "X"</strong>. You will have varying amounts of time to respond to each letter. Try to respond as quickly and accurately as possible.</p>
        <button id="cpt_start" class="tutorial_btn">Start the Task</button>
    </div>

    <!-- CPT Container for the Task -->
    <div id="cpt_container" style="visibility: hidden;">
        <div id="cpt_progress">0/360</div> <!-- Progress tracker -->
        <div id="cpt_stimulus"></div> <!-- Stimulus display -->
    </div>

    <!-- Include the CPT JavaScript -->
    <script src="/static/js/cpt.js?v=2.0"></script>
</body>
</html>
