<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scoring Module</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #d0fbff, #e5fdff);
        color: #2b2b2b;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        margin: 20px;
        font-size: 24px;
        text-align: center;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        margin: 0 auto;
      }

      div {
        text-align: center;
      }

      .user_ID {
        font-size: 2.5rem;
        font-weight: 800;
        margin: 40px 0 20px;
        padding: 15px 40px;
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        color: #1a1a1a;
        text-align: center;
      }

      .graph_container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 30px;
        width: 90%;
        max-width: 1200px;
        margin-bottom: 40px;
      }

      .single_graph_wrapper {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        flex: 1;
        min-width: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .graph_title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 20px;
        color: #333;
      }

      .image-container {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .complete_time_wrapper {
        font-size: 1.25rem;
        margin-top: 25px;
        color: #444;
      }

      .completion_time {
        font-weight: 600;
        color: #478f96;
      }

      #mqtt-data {
        margin-top: 15px;
        padding: 12px 20px;
        background: rgba(0, 0, 0, 0.04);
        border-radius: 12px;
        font-family: monospace;
        color: #e63946;
        font-weight: bold;
        display: inline-block;
      }

      a {
        text-decoration: none;
      }

      #next_level {
        margin: 20px auto 50px;
        padding: 15px 45px;
        font-size: 1.1rem;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        background-color: #478f96;
        background-image: linear-gradient(135deg, #478f96 0%, #35737a 100%);
        border-radius: 30px;
        color: #fff;
        border: none;
        cursor: pointer;
        box-shadow: 0 8px 15px rgba(71, 143, 150, 0.3);
        transition: all 0.3s ease;
      }

      #next_level:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 20px rgba(71, 143, 150, 0.4);
      }
    </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
        <script>
            const socket = io.connect('http://' + document.domain + ':' + location.port);
            socket.on('mqtt_message', function(msg) {
                document.getElementById('mqtt-data').innerHTML = msg.data;
            });
        </script>
  </head>
  <body>
    <div class="user_ID">Scoring Page (User: {{ userID }})</div>

    <!-- Graphs -->
    <div class="graph_container">
      <div class="single_graph_wrapper">
        <div class="graph_title">Mouse Movement Data</div>
        <div class="complete_time_wrapper" style="margin-top: 0; margin-bottom: 20px;">
          <span id="completion_time" class="completion_time"></span>
        </div>
        
        <div style="margin-bottom: 20px;">
          <div style="color: #666; font-size: 0.9em;">Received MQTT Data:</div>
          <div id="mqtt-data">Waiting for data...</div>
        </div>

        <div
          class="image-container"
          id="mouse_movement_graph"
          data-endpoint="mouse_movement_graph"
        >
          <div class="loading" style="display: none">Loading...</div>
          <div class="error" style="display: none; color: red">
            Error loading graph.
          </div>
          <img class="image" alt="Image 1" style="display: none" />
        </div>
      </div>
    </div>

   
    
    <!-- Depending on what level user is on, change where to redirect -->
    {% if level < 3 %}
    <a href="{{ url_for('tiles_game') }}"
      ><button id="next_level">Next Level</button></a
    >
    {% else %}
    <a href="{{ url_for('home') }}"><button id="next_level">Finish</button></a>
    {% endif %}

    <script src="{{ url_for('static', filename='js/helper_functions.js') }}"></script>
    <script src="{{ url_for('static', filename='js/scoring_page.js') }}"></script>

  </body>
</html>
